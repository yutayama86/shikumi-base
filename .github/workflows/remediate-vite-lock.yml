name: One-time Vite lockfile remediation
on:
  pull_request:
    paths:
      - '.github/workflows/remediate-vite-lock.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Regenerate lockfile to patched transitive packages
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh Vite and transitive dependency lockfile'
            git push origin HEAD:${{ github.head_ref }}
          fi
